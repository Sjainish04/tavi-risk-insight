[project]
name = "tavi-api"
version = "0.1.0"
description = "TAVI Risk Insight — FastAPI backend for IBM Z × UNSA Sheridan Hackathon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "TAVI Risk Insight Team" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    # ML
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    # Pinned to avoid uv resolving an old llvmlite that doesn't support Py 3.12
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    # IBM
    "ibm-watsonx-ai>=1.1.0",
    "ibm-cloud-sdk-core>=3.20.0",
    # OpenAI-compatible (Featherless + premium fallback)
    "openai>=1.50.0",
    # HF fallback
    "huggingface-hub>=0.26.0",
    # Crypto fallback
    "cryptography>=43.0.0",
    # Logging + env
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "catboost>=1.2.10",
    "tabpfn>=7.1.1",
    "tabpfn-client>=0.2.8",
    "sts-risk-calculator>=1.2.1",
    "dcurves>=1.1.7",
    "fairlearn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavi_api"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
tavi-train = "tavi_api.model.train:main"
tavi-encrypt = "tavi_api.crypto.fernet_fallback:main"
